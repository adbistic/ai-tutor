<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundations of AI - a tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17150f;--bg2:#1d1a13;--card:#231f17;--card2:#2b261c;--line:#3a3427;
  --text:#ece5d3;--mute:#a39b86;--acc:#d9794c;--acc2:#9bb58a;--hot:#d6a64a;--blue:#7f9db3;
  --ok:#93b87a;--bad:#d9705f;--code:#1b1812;--shadow:0 1px 0 rgba(0,0,0,.25);
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.22,.7,.2,1);
}
:root[data-theme=light]{
  --bg:#f4efe3;--bg2:#ece5d3;--card:#fbf8f0;--card2:#f1ebdb;--line:#d9d0b9;
  --text:#2a261c;--mute:#6f6753;--acc:#b8552b;--acc2:#5f7d4e;--hot:#a87a16;--blue:#46657d;
  --ok:#4f7a3a;--bad:#b2402f;--code:#f0e9d6;--shadow:0 1px 0 rgba(60,45,20,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.65 var(--sans);transition:background .4s var(--ease),color .4s var(--ease)}
a{color:var(--acc)}
button{font:inherit;color:inherit;cursor:pointer}
::selection{background:var(--acc);color:var(--bg)}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--acc);z-index:60;transition:width .15s linear}
.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--bg2);padding:22px 18px 40px;transition:transform .4s var(--ease)}
.brand{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.15;letter-spacing:-.01em;margin:0 0 4px}
.brand small{display:block;font:500 12px/1.4 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.grp{font:600 11.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:26px 8px 8px}
.nv{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:8px 8px;border-radius:6px;color:var(--text);position:relative;transition:background .2s,transform .25s var(--ease)}
.nv:hover{background:var(--card2);transform:translateX(3px)}
.nv .n{font:500 12px var(--mono);color:var(--mute);min-width:22px}
.nv .t{flex:1;line-height:1.3;font-size:15.5px}
.nv .d{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);flex:none;align-self:center;transition:all .4s var(--ease)}
.nv.part .d{background:linear-gradient(90deg,var(--hot) 50%,transparent 50%);border-color:var(--hot)}
.nv.done .d{background:var(--ok);border-color:var(--ok)}
.nv.on{background:var(--card2);box-shadow:inset 3px 0 0 var(--acc)}
.side .tools{display:flex;gap:8px;margin-top:22px}
.side .tools button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:14px}
.side .tools button:hover{border-color:var(--acc)}
main{padding:0 clamp(18px,5vw,72px) 120px;max-width:1040px;width:100%}
.top{display:none}
.page{animation:pg .6s var(--ease) both}
@keyframes pg{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kick{font:600 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:64px 0 14px}
h1{font:700 clamp(34px,5vw,54px)/1.08 var(--serif);letter-spacing:-.02em;margin:0 0 14px}
h2{font:700 30px/1.15 var(--serif);letter-spacing:-.01em;margin:56px 0 12px}
h3{font:600 21px/1.25 var(--serif);margin:34px 0 8px}
.lede{font:400 21px/1.5 var(--serif);color:var(--mute);max-width:44em;margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--mute);margin:14px 0 8px}
p,li{max-width:46em}
code{font:500 .88em var(--mono);background:var(--card2);padding:.12em .4em;border-radius:4px}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
.note{border-left:3px solid var(--hot);background:var(--card);padding:12px 18px;margin:20px 0;border-radius:0 6px 6px 0}
.note b.l{display:block;font:600 11.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--hot);margin-bottom:2px}
.note.warn{border-color:var(--bad)}.note.warn b.l{color:var(--bad)}
.note.ok{border-color:var(--acc2)}.note.ok b.l{color:var(--acc2)}
.defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:18px 0}
.defs div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;transition:transform .3s var(--ease),border-color .3s}
.defs div:hover{transform:translateY(-3px);border-color:var(--acc)}
.defs b{display:block;font:600 18px var(--serif);margin-bottom:3px}
table{border-collapse:collapse;margin:18px 0;font-size:15.5px;max-width:100%;display:block;overflow:auto}
th,td{border:1px solid var(--line);padding:7px 12px;text-align:left}
th{background:var(--card2);font-weight:600}
.cb{margin:20px 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--code);overflow:hidden;box-shadow:var(--shadow)}
.cb-bar{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 14px;border-bottom:1px solid var(--line);font:500 12px var(--mono);color:var(--mute)}
.cb-bar .sp{flex:1}
.cb-bar button{background:none;border:1px solid var(--line);border-radius:5px;padding:3px 10px;font:500 12.5px var(--sans);color:var(--text)}
.cb-bar button:hover{border-color:var(--acc)}
.cb-bar button.go{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
.cb-bar button.go:hover{filter:brightness(1.08)}
.cb pre{margin:0;padding:12px 0;overflow:auto;counter-reset:l;font:400 14.5px/1.6 var(--mono);tab-size:4}
.cb code{background:none;padding:0;font:inherit;display:block;min-width:max-content}
.ln{display:block;padding:0 16px 0 0;white-space:pre;transition:background .2s}
.ln::before{counter-increment:l;content:counter(l);display:inline-block;width:42px;padding-right:14px;text-align:right;color:var(--mute);opacity:.55;user-select:none}
.ln.hi{background:rgba(217,121,76,.18);box-shadow:inset 3px 0 0 var(--acc)}
:root[data-theme=light] .ln.hi{background:rgba(184,85,43,.13)}
.ln i{font-style:normal}.ln .k{color:var(--acc)}.ln .s{color:var(--acc2)}.ln .n{color:var(--hot)}.ln .c{color:var(--mute);font-style:italic}.ln .f{color:var(--blue)}
.cb-ed{display:block;width:100%;min-height:120px;background:var(--code);color:var(--text);border:0;border-top:1px solid var(--line);padding:12px 16px;font:400 14.5px/1.6 var(--mono);resize:vertical;outline:none;tab-size:4;white-space:pre}
.out{margin:0;padding:12px 16px;border-top:1px solid var(--line);background:var(--bg);font:400 13.5px/1.55 var(--mono);white-space:pre-wrap;max-height:340px;overflow:auto}
.out.err{color:var(--bad)}
.out .tag{display:block;font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
ol.ex{list-style:none;counter-reset:e;margin:0 0 26px;padding:0;border-left:2px solid var(--line)}
ol.ex li{counter-increment:e;padding:8px 14px 8px 16px;cursor:default;transition:background .2s,border-color .2s;border-left:2px solid transparent;margin-left:-2px;max-width:none}
ol.ex li:hover,ol.ex li.on{background:var(--card);border-left-color:var(--acc)}
ol.ex li b{font:500 12.5px var(--mono);color:var(--acc);margin-right:8px}
.hintline{font-size:13.5px;color:var(--mute);margin:-4px 0 6px}
.viz{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:24px 0}
.viz .vt{font:600 11.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:12px;display:flex;justify-content:space-between;gap:12px}
.viz svg,.viz canvas{max-width:100%;height:auto;display:block}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:12px;font-size:14.5px}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:6px 14px;font-size:14.5px;transition:all .2s var(--ease)}
.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
.btn:disabled{opacity:.4;pointer-events:none}
input[type=range]{accent-color:var(--acc);vertical-align:middle}
input[type=text],textarea.tx,select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit;outline:none}
input[type=text]:focus,textarea.tx:focus,select:focus{border-color:var(--acc)}
.mono{font-family:var(--mono)}
.pill{display:inline-block;font:500 12.5px var(--mono);background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:1px 10px}
.qz{margin:70px 0 0;border-top:1px solid var(--line);padding-top:8px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:14px 0;animation:pg .5s var(--ease) both}
.q .qn{font:600 11.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.q .qt{font:600 19px/1.4 var(--serif);margin:4px 0 12px}
.q pre.qc{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:10px 14px;font:400 14px/1.55 var(--mono);overflow:auto;margin:0 0 12px}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 14px;margin:7px 0;transition:all .25s var(--ease)}
.opt:hover:not([disabled]){border-color:var(--acc);transform:translateX(4px)}
.opt .k{font:500 13px var(--mono);color:var(--mute);padding-top:2px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--bg));animation:shk .35s}
@keyframes shk{20%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
.opt[disabled]{cursor:default}
.why{margin-top:10px;font-size:15.5px;color:var(--mute);border-left:2px solid var(--line);padding-left:12px;animation:pg .4s var(--ease) both}
.score{display:flex;align-items:center;gap:14px;margin:16px 0;flex-wrap:wrap}
.meter{flex:1;min-width:140px;height:8px;background:var(--bg2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--acc);transition:width .8s var(--ease)}
.task{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:16px 0}
.task textarea{width:100%;min-height:150px;background:var(--code);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:12px;font:400 14.5px/1.6 var(--mono);resize:vertical;outline:none;tab-size:4;white-space:pre;margin:10px 0}
.task.ok{border-color:var(--ok)}
.pp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 22px;margin:18px 0}
.pp h3{margin:2px 0 10px}
.ppk{font:600 11.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.ppq p,.ppq li{line-height:1.6}
.ppl{padding-left:22px}
.ppl>li{margin:8px 0}
.mth{font:500 16px var(--mono);margin:6px 0}
.ppbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;margin:10px 0 4px}
.ppbar b{margin-right:auto}
.ppx textarea{width:100%;min-height:200px;background:var(--code);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:12px;font:400 14.5px/1.6 var(--mono);resize:vertical;outline:none;tab-size:4;white-space:pre;margin:8px 0}
.ppsc{margin-left:auto;color:var(--mute);align-self:center}
.pp.ok{border-color:var(--ok)}
.ppr{list-style:none;padding:0;margin:0 0 8px}
.ppr li{padding:2px 0}
.ppr li.y{color:var(--ok)}
.ppr li.n{color:var(--bad)}
.pperr{white-space:pre-wrap;font:13.5px/1.5 var(--mono);margin:6px 0}
.ppsol{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.pps{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.pps>summary{cursor:pointer;font:600 15px var(--sans);color:var(--acc)}
.pps>summary:hover{text-decoration:underline}
.ppb{margin-top:12px}
.res{font-size:15px;margin-top:8px;white-space:pre-wrap;font-family:var(--mono)}
.res.good{color:var(--ok)}.res.bad{color:var(--bad)}
.pnav{display:flex;justify-content:space-between;gap:14px;margin-top:60px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:22px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;text-align:left;transition:all .3s var(--ease);display:block;width:100%}
.card:hover{transform:translateY(-4px);border-color:var(--acc)}
.card .cn{font:500 12px var(--mono);color:var(--mute)}
.card h4{font:600 20px/1.2 var(--serif);margin:6px 0}
.card p{font-size:15px;color:var(--mute);margin:0}
.prompt{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 44px 12px 16px;margin:10px 0;position:relative;max-width:46em;font-size:16px}
.prompt button{position:absolute;right:8px;top:8px;background:none;border:1px solid var(--line);border-radius:5px;font-size:12.5px;padding:2px 8px}
.prompt button:hover{border-color:var(--acc)}
.cell{transition:fill .35s var(--ease),stroke .35s var(--ease),opacity .35s}
.menu{display:none}
@media(max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  main{min-width:0;overflow-x:hidden}
  table{max-width:100%}
  nav.side{position:fixed;z-index:50;width:290px;transform:translateX(-102%)}
  nav.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  .top{display:flex;position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;gap:12px}
  .top button{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 12px}
  .kick{margin-top:36px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="bar"></div>
<div class="top"><button id="menu">Menu</button><span class="brand" style="font-size:18px">Foundations of AI</span></div>
<div class="app">
<nav class="side" id="side"></nav>
<main id="main"></main>
</div>
<script>
const SEARCH_PY="\"\"\"search_core: a small, readable version of the search library used in class.\n\nSame names as the course file (Problem, Node, breadth_first_tree_search, ...)\nso code written in the lessons looks exactly like the code in your folder.\nEvery search stops with an error after MAX_EXPANSIONS so a bad problem can\nnever freeze the browser.\n\"\"\"\nimport heapq\nimport itertools\nimport random\nfrom collections import deque\n\nMAX_EXPANSIONS = 30000\nSTATS = {\"expanded\": 0}\n\n\ndef _tick():\n    STATS[\"expanded\"] += 1\n    if STATS[\"expanded\"] > MAX_EXPANSIONS:\n        raise RuntimeError(\n            \"Stopped: more than %d nodes expanded. \"\n            \"The search is probably looping forever.\" % MAX_EXPANSIONS)\n\n\nclass Problem:\n    def __init__(self, initial, goal=None):\n        self.initial = initial\n        self.goal = goal\n\n    def actions(self, state):\n        raise NotImplementedError\n\n    def result(self, state, action):\n        raise NotImplementedError\n\n    def goal_test(self, state):\n        if isinstance(self.goal, list):\n            for s in self.goal:\n                if s == state:\n                    return True\n            return False\n        return state == self.goal\n\n    def path_cost(self, c, state1, action, state2):\n        return c + 1\n\n    def value(self, state):\n        raise NotImplementedError\n\n\nclass Node:\n    def __init__(self, state, parent=None, action=None, path_cost=0):\n        self.state = state\n        self.parent = parent\n        self.action = action\n        self.path_cost = path_cost\n        self.depth = 0\n        if parent:\n            self.depth = parent.depth + 1\n\n    def __repr__(self):\n        return \"<Node {}>\".format(self.state)\n\n    def __lt__(self, node):\n        return self.path_cost < node.path_cost\n\n    def expand(self, problem):\n        return [self.child_node(problem, a) for a in problem.actions(self.state)]\n\n    def child_node(self, problem, action):\n        nxt = problem.result(self.state, action)\n        cost = problem.path_cost(self.path_cost, self.state, action, nxt)\n        return Node(nxt, self, action, cost)\n\n    def solution(self):\n        return [n.action for n in self.path()[1:]]\n\n    def path(self):\n        node, back = self, []\n        while node:\n            back.append(node)\n            node = node.parent\n        return list(reversed(back))\n\n    def __eq__(self, other):\n        return isinstance(other, Node) and self.state == other.state\n\n    def __hash__(self):\n        return hash(self.state)\n\n\ndef breadth_first_tree_search(problem):\n    STATS[\"expanded\"] = 0\n    frontier = deque([Node(problem.initial)])\n    while frontier:\n        node = frontier.popleft()\n        if problem.goal_test(node.state):\n            return node\n        _tick()\n        frontier.extend(node.expand(problem))\n    return None\n\n\ndef depth_first_tree_search(problem):\n    STATS[\"expanded\"] = 0\n    frontier = [Node(problem.initial)]\n    while frontier:\n        node = frontier.pop()\n        if problem.goal_test(node.state):\n            return node\n        _tick()\n        frontier.extend(node.expand(problem))\n    return None\n\n\ndef breadth_first_graph_search(problem):\n    STATS[\"expanded\"] = 0\n    node = Node(problem.initial)\n    if problem.goal_test(node.state):\n        return node\n    frontier = deque([node])\n    explored = set()\n    while frontier:\n        node = frontier.popleft()\n        _tick()\n        explored.add(node.state)\n        for child in node.expand(problem):\n            if child.state not in explored and child not in frontier:\n                if problem.goal_test(child.state):\n                    return child\n                frontier.append(child)\n    return None\n\n\ndef depth_first_graph_search(problem):\n    STATS[\"expanded\"] = 0\n    frontier = [Node(problem.initial)]\n    explored = set()\n    while frontier:\n        node = frontier.pop()\n        if problem.goal_test(node.state):\n            return node\n        _tick()\n        explored.add(node.state)\n        frontier.extend(c for c in node.expand(problem)\n                        if c.state not in explored and c not in frontier)\n    return None\n\n\ndef best_first_graph_search(problem, f):\n    STATS[\"expanded\"] = 0\n    counter = itertools.count()\n    start = Node(problem.initial)\n    frontier = [(f(start), next(counter), start)]\n    best = {start.state: f(start)}\n    explored = set()\n    while frontier:\n        _, _, node = heapq.heappop(frontier)\n        if node.state in explored:\n            continue\n        if problem.goal_test(node.state):\n            return node\n        _tick()\n        explored.add(node.state)\n        for child in node.expand(problem):\n            fc = f(child)\n            if child.state not in explored and fc < best.get(child.state, float(\"inf\")):\n                best[child.state] = fc\n                heapq.heappush(frontier, (fc, next(counter), child))\n    return None\n\n\ndef uniform_cost_search(problem):\n    return best_first_graph_search(problem, lambda n: n.path_cost)\n\n\ndef astar_search(problem, h=None):\n    h = h or problem.h\n    return best_first_graph_search(problem, lambda n: n.path_cost + h(n))\n\n\ndef Trial_Error(problem, max_steps=2000):\n    \"\"\"Random walk: pick any legal action at random until the goal shows up.\"\"\"\n    node = Node(problem.initial)\n    for _ in range(max_steps):\n        if problem.goal_test(node.state):\n            return node\n        kids = node.expand(problem)\n        if not kids:\n            return None\n        node = random.choice(kids)\n    return None\n\n\ndef hill_climbing(problem):\n    \"\"\"Always step to the best neighbour; stop when no neighbour is better.\"\"\"\n    current = Node(problem.initial)\n    while True:\n        neighbours = current.expand(problem)\n        if not neighbours:\n            break\n        best = max(neighbours, key=lambda n: problem.value(n.state))\n        if problem.value(best.state) <= problem.value(current.state):\n            break\n        current = best\n    return current.state\n\n\n# ---------------------------------------------------------------- more search\nimport math\n\n\ndef depth_limited_search(problem, limit=50, _reset=True):\n    \"\"\"DFS that refuses to go deeper than `limit`. Returns a Node, None\n    (no solution inside the limit and nothing was cut) or 'cutoff'.\"\"\"\n    if _reset:\n        STATS[\"expanded\"] = 0\n\n    def recursive_dls(node, limit):\n        if problem.goal_test(node.state):\n            return node\n        elif limit == 0:\n            return 'cutoff'\n        else:\n            _tick()\n            cutoff_occurred = False\n            for child in node.expand(problem):\n                result = recursive_dls(child, limit - 1)\n                if result == 'cutoff':\n                    cutoff_occurred = True\n                elif result is not None:\n                    return result\n            return 'cutoff' if cutoff_occurred else None\n\n    return recursive_dls(Node(problem.initial), limit)\n\n\ndef iterative_deepening_search(problem, max_depth=40):\n    \"\"\"Run depth-limited search with limit 0, 1, 2, ... until it stops cutting.\"\"\"\n    STATS[\"expanded\"] = 0\n    for depth in range(max_depth):\n        result = depth_limited_search(problem, depth, _reset=False)\n        if result != 'cutoff':\n            return result\n    return None\n\n\nclass EightPuzzle(Problem):\n    \"\"\"3x3 sliding tiles. A state is a tuple of 9 numbers, 0 is the blank.\"\"\"\n\n    def __init__(self, initial, goal=(1, 2, 3, 4, 5, 6, 7, 8, 0)):\n        super().__init__(initial, goal)\n\n    def find_blank_square(self, state):\n        return state.index(0)\n\n    def actions(self, state):\n        possible_actions = ['UP', 'DOWN', 'LEFT', 'RIGHT']\n        index_blank_square = self.find_blank_square(state)\n        if index_blank_square % 3 == 0:\n            possible_actions.remove('LEFT')\n        if index_blank_square < 3:\n            possible_actions.remove('UP')\n        if index_blank_square % 3 == 2:\n            possible_actions.remove('RIGHT')\n        if index_blank_square > 5:\n            possible_actions.remove('DOWN')\n        return possible_actions\n\n    def result(self, state, action):\n        blank = self.find_blank_square(state)\n        new_state = list(state)\n        delta = {'UP': -3, 'DOWN': 3, 'LEFT': -1, 'RIGHT': 1}\n        neighbor = blank + delta[action]\n        new_state[blank], new_state[neighbor] = new_state[neighbor], new_state[blank]\n        return tuple(new_state)\n\n    def check_solvability(self, state):\n        inversion = 0\n        for i in range(len(state)):\n            for j in range(i + 1, len(state)):\n                if (state[i] > state[j]) and state[i] != 0 and state[j] != 0:\n                    inversion += 1\n        return inversion % 2 == 0\n\n    def h(self, node):\n        \"\"\"Number of misplaced tiles.\"\"\"\n        return sum(s != g for (s, g) in zip(node.state, self.goal))\n\n\ndef exp_schedule(k=20, lam=0.005, limit=100):\n    return lambda t: (k * math.exp(-lam * t) if t < limit else 0)\n\n\ndef simulated_annealing(problem, schedule=exp_schedule()):\n    \"\"\"Like hill climbing, but sometimes accepts a WORSE neighbour.\n    The chance is e^(delta/T); T (temperature) falls over time.\"\"\"\n    current = Node(problem.initial)\n    t = 0\n    while True:\n        T = schedule(t)\n        if T == 0:\n            return current.state\n        neighbours = current.expand(problem)\n        if not neighbours:\n            return current.state\n        nxt = random.choice(neighbours)\n        delta_e = problem.value(nxt.state) - problem.value(current.state)\n        if delta_e > 0 or random.random() < math.exp(delta_e / T):\n            current = nxt\n        t += 1\n\n\ndef init_population(pop_number, gene_pool, state_length):\n    return [[random.choice(gene_pool) for _ in range(state_length)]\n            for _ in range(pop_number)]\n\n\ndef select(r, population, fitness_fn):\n    weights = [fitness_fn(p) for p in population]\n    return random.choices(population, weights=weights, k=r)\n\n\ndef recombine(x, y):\n    c = random.randrange(0, len(x))\n    return x[:c] + y[c:]\n\n\ndef mutate(x, gene_pool, pmut):\n    if random.uniform(0, 1) >= pmut:\n        return x\n    c = random.randrange(0, len(x))\n    return x[:c] + [random.choice(gene_pool)] + x[c + 1:]\n\n\ndef genetic_algorithm(population, fitness_fn, gene_pool=[0, 1], f_thres=None, ngen=1000, pmut=0.1):\n    for _ in range(ngen):\n        population = [mutate(recombine(*select(2, population, fitness_fn)), gene_pool, pmut)\n                      for _ in range(len(population))]\n        best = max(population, key=fitness_fn)\n        if f_thres and fitness_fn(best) >= f_thres:\n            return best\n    return max(population, key=fitness_fn)\n";

    else if(/^[A-Za-z_]/.test(t)&&src[re.lastIndex]==='(')c='f';
    t.split('\n').forEach((p,i)=>{if(i>0)lines.push('');lines[lines.length-1]+=c?`<i class="${c}">${esc(p)}</i>`:esc(p)});
  }
  return lines;
}

/* ---------- Pyodide runner ---------- */
const PY={ready:false,p:null,
  load(){
    if(!this.p)this.p=(async()=>{
      await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';s.onload=res;s.onerror=()=>rej(new Error('Could not download Python (pyodide). Check your internet connection.'));document.head.appendChild(s)});
      const py=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/'});
      py.FS.writeFile('/home/pyodide/search.py',SEARCH_PY);
      for(const [k,v] of Object.entries(window.PYFILES||{}))py.FS.writeFile('/home/pyodide/'+k,v);
      await py.runPythonAsync("import sys\nif '/home/pyodide' not in sys.path: sys.path.insert(0,'/home/pyodide')");
      py.FS.writeFile('/home/pyodide/utils.py','from search import *\n');
      py.FS.writeFile('/home/pyodide/mt_utils.py','from search import *\n');
      await py.runPythonAsync("import sys, types\nclass _Dummy(types.ModuleType):\n    def __getattr__(self, n):\n        if n.startswith('__'):\n            raise AttributeError(n)\n        return lambda *a, **k: None\n_m = _Dummy('matplotlib')\n_p = _Dummy('matplotlib.pyplot')\n_m.pyplot = _p\nsys.modules['matplotlib'] = _m\nsys.modules['matplotlib.pyplot'] = _p");
      this.ready=true;return py;
    })();
    return this.p;
  },
  async run(code){
    let out='';
    try{
      const py=await this.load();
      py.setStdout({batched:s=>out+=s+'\n'});py.setStderr({batched:s=>out+=s+'\n'});
      if(/\bnumpy\b|\bnp\./.test(code))await py.loadPackage('numpy');
      const g=py.globals.get('dict')();
      g.set('__name__','__main__');
      try{await py.runPythonAsync(code,{globals:g})}finally{g.destroy()}
      return {ok:true,out};
    }catch(e){
      let m=String(e.message||e);const i=m.lastIndexOf('File "<exec>"');
      if(i>=0)m=m.slice(i);else m=m.split('\n').slice(-4).join('\n');
      m=m.replace(/File "<exec>", /,'');
      return {ok:false,out,err:m};
    }
  }
};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderMCQ(host,title,qs,onDone,codeKind){
  host.innerHTML='';
  const order=shuffle(qs);let right=0,answered=0;
  const head=document.createElement('div');head.className='score';
  head.innerHTML=`<span class="mono" data-s>0 / ${order.length}</span><div class="meter"><i></i></div>`;
  host.appendChild(head);
  order.forEach((q,qi)=>{
    const opts=shuffle(q.o.map((t,i)=>({t,ok:i===0})));
    const d=document.createElement('div');d.className='q';d.style.animationDelay=(qi*60)+'ms';
    d.innerHTML=`<div class="qn">${title} · question ${qi+1}</div><div class="qt">${q.q}</div>${q.c?`<pre class="qc">${esc(q.c)}</pre>`:''}`;
    opts.forEach((o,i)=>{
      const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="k">${'ABCD'[i]}</span><span>${o.t}</span>`;
      b.onclick=()=>{
        if(d.dataset.done)return;d.dataset.done=1;answered++;
        $$('.opt',d).forEach((x,j)=>{x.disabled=true;if(opts[j].ok)x.classList.add('right')});
        if(o.ok)right++;else b.classList.add('wrong');
        const w=document.createElement('div');w.className='why';w.innerHTML=(o.ok?'Correct. ':'Not quite. ')+q.w;d.appendChild(w);
        const pct=Math.round(right/order.length*100);
        $('[data-s]',head).textContent=`${right} / ${order.length}`;$('.meter i',head).style.width=(answered/order.length*100)+'%';
        if(answered===order.length){
          const r=document.createElement('div');r.className='score';r.innerHTML=`<b>Final: ${pct}%</b><button class="btn p">Try again (new shuffle)</button>`;
          $('button',r).onclick=()=>{renderMCQ(host,title,qs,onDone,codeKind);host.scrollIntoView({behavior:'smooth'})};
          host.appendChild(r);onDone(pct);
        }
      };
      d.appendChild(b);
    });
    host.appendChild(d);
  });
}
function renderTasks(host,tasks,onDone){

const PPCFG={};

const ppStore=()=>{try{localStorage.setItem('aitutor.pp',JSON.stringify(PPSAVE))}catch(e){}};
const PYPRE=`
import json
_R = []
def T(name, fn):
    try:
        ok = bool(fn())
    except Exception:
        ok = False
    _R.append((name, ok))
`;
async function ppGrade(code,tests){
  const full=code+'\n\n_SRC = '+JSON.stringify(code)+'\n'+PYPRE+'\nfrom search import Problem\n'+tests+'\nprint("@@" + json.dumps(_R))';
  const r=await PY.run(full);
  const lines=(r.out||'').split('\n');
  const k=lines.findIndex(l=>l.startsWith('@@'));
  const shown=lines.filter((l,i)=>i!==k).join('\n').trim();
  if(k>=0&&r.ok)return {rows:JSON.parse(lines[k].slice(2)),out:shown};
  return {rows:null,err:r.err||'The tests could not run.',out:shown};
}
function initPapers(root,lid){
  const secs=$$('.pp[data-pp]',root);if(!secs.length)return;
  const P=(PPSAVE[lid]=PPSAVE[lid]||{});
  const bar=$('#ppbar',root);
  const mins=+(bar&&bar.dataset.min)||90;
  let left=mins*60,tick=null,fin=!!P._fin;
  const items=[];
  const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  const scoreAll=()=>{
    const got=items.reduce((a,x)=>a+(x.st.score||0),0),mx=items.reduce((a,x)=>a+x.cfg.pts,0);
    const el=bar&&$('[data-sc]',bar);if(el)el.textContent=(Math.round(got*10)/10)+' / '+mx+' points'+(fin?' · '+Math.round(got/mx*100)+'%':'');
  };
  secs.forEach(sec=>{
    const key=sec.dataset.pp,cfg=PPCFG[key];if(!cfg)return;
    const st=P[key]=P[key]||{};
    const tpl=sec.querySelector('template');const solHtml=tpl?tpl.innerHTML:'';if(tpl)tpl.remove();
    const box=document.createElement('div');box.className='ppx';
    box.innerHTML=`<div class="ppk" style="margin-top:14px">Your answer · ${cfg.pts} points</div><textarea spellcheck="false"></textarea><div class="ctl"><button class="btn p" data-c>Check my answer</button>${cfg.py?'<button class="btn" data-r>Run my code</button>':''}<button class="btn" data-h>Hint</button><button class="btn" data-z>Reset</button><button class="btn" data-s>Give up, show solution</button><span class="ppsc mono"></span></div><div class="res"></div><div class="ppsol" hidden></div>`;
    sec.appendChild(box);
    const ta=$('textarea',box),res=$('.res',box),sol=$('.ppsol',box),lab=$('.ppsc',box);
    ta.value=st.code!=null?st.code:cfg.start.replace(/^\n/,'');
    ta.rows=Math.min(26,Math.max(9,ta.value.split('\n').length+1));
    ta.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart;ta.value=ta.value.slice(0,s)+'    '+ta.value.slice(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=s+4}});
    ta.addEventListener('input',()=>{st.code=ta.value;ppStore()});
    const paint=()=>{lab.textContent=(st.seen?'solution seen · ':'')+(Math.round((st.score||0)*10)/10)+' / '+cfg.pts;sec.classList.toggle('ok',(st.score||0)>=cfg.pts);scoreAll()};
    const reveal=()=>{st.seen=true;sol.hidden=false;sol.innerHTML='<div class="ppk">Solution</div>'+solHtml;enhance(sol);$('[data-s]',box).disabled=true;paint();ppStore()};
    items.push({st,cfg,reveal});
    $('[data-h]',box).onclick=()=>{res.className='res';res.textContent='Hint: '+(cfg.hint||'Read the question again and go step by step.')};
    $('[data-z]',box).onclick=()=>{if(confirm('Reset this answer to the starting code?')){ta.value=cfg.start.replace(/^\n/,'');st.code=ta.value;ppStore()}};
    $('[data-s]',box).onclick=()=>{if(confirm('Show the solution? You keep the points you already have, but you cannot earn more on this question.'))reveal()};
    const rb=$('[data-r]',box);
    if(rb)rb.onclick=async()=>{rb.disabled=true;res.className='res';res.textContent='Running...';const r=await PY.run(ta.value);rb.disabled=false;res.className='res'+(r.ok?'':' bad');res.textContent=((r.out||'')+(r.err?'\n'+r.err:'')).trim()||'(no output)'};
    $('[data-c]',box).onclick=async e=>{
      const b=e.target;b.disabled=true;res.className='res';res.textContent='Checking...';
      const code=ta.value;let rows=[],errTxt='',outTxt='';
      if(cfg.tests){const g=await ppGrade(code,cfg.tests);if(g.rows)rows=rows.concat(g.rows);else{rows.push(['Your code runs without errors',false]);errTxt=g.err}outTxt=g.out}
      (cfg.checks||[]).forEach(([l,re,not])=>rows.push([l,re.test(code)!==!!not]));
      if(cfg.minWords)rows.push(['The answer has at least '+cfg.minWords+' words',code.trim().split(/\s+/).length>=cfg.minWords]);
      const ok=rows.filter(r=>r[1]).length,sc=rows.length?Math.round(cfg.pts*ok/rows.length*10)/10:0;
      if(!st.seen&&sc>(st.score||0))st.score=sc;
      paint();ppStore();b.disabled=false;
      res.className='res '+(ok===rows.length?'good':'');
      res.innerHTML='<ul class="ppr">'+rows.map(r=>'<li class="'+(r[1]?'y':'n')+'">'+(r[1]?'&#10003; ':'&#10007; ')+esc(r[0])+'</li>').join('')+'</ul>'+(errTxt?'<pre class="pperr">'+esc(errTxt)+'</pre>':'')+(ok===rows.length?'<b>All checks passed.</b>'+(st.seen?' (The solution was already shown, so no extra points.)':''):'<b>'+ok+' of '+rows.length+' checks passed.</b> Fix your code and check again.');
    };
    if(st.seen)reveal();else paint();
  });
  if(bar){
    bar.innerHTML=`<b data-sc></b><span class="mono" data-tm>${fmt(left)}</span><button class="btn" data-go>Start timer</button><button class="btn p" data-fin>Finish test</button><button class="btn" data-new>Start over</button>`;

    $('[data-new]',bar).onclick=()=>{if(confirm('Erase your answers and score for this paper and start again?')){delete PPSAVE[lid];ppStore();route()}};
  }
  scoreAll();
}

html:()=>`
<div class="kick">Part 0 · about 30 minutes</div>
<h1>The Python the AI code leans on</h1>
<p class="lede">You know the basics. Here are the five things the course code uses constantly: collections, copying, functions, classes with inheritance, and numpy.</p>

<h2>1. Four collections</h2>
<div class="defs">
 <div><b>list [1, 2]</b>Ordered, changeable, allows repeats.</div>
 <div><b>tuple (1, 2)</b>Ordered, not changeable. Can be a dictionary key and works in a set.</div>
 <div><b>set {1, 2}</b>No order, no repeats. Fast "is it in here?" check.</div>
 <div><b>dict {"a": 1}</b>Key to value. Fast lookup by key.</div>
</div>
<p>States in search problems are usually tuples, because a search needs to remember "have I seen this state already?" and only unchangeable things can go in a set.</p>
${C(String.raw`
shopping = ["milk", "eggs", "milk"]   # list: keeps the repeat
point = (3, 4)                        # tuple: fixed pair
seen = {1, 2, 2, 3}                   # set: the extra 2 disappears
ages = {"Anna": 20, "Ben": 22}        # dict: name -> age

print(len(shopping), point[0], seen)
print(ages["Ben"])
print(3 in seen, 7 in seen)
seen.add(7)
print(seen)
`,{run:true})}
${EX([['1','<code>shopping</code> is a <b>list</b>, written with square brackets. It keeps the order and it keeps repeats, so <code>\'milk\'</code> is stored twice. Use a list when order matters or repeats are fine.'],['2','<code>point</code> is a <b>tuple</b>: round brackets. It works like a list but it can never be changed after it is made. That is exactly why search states are often tuples: nobody can change them by accident.'],['3','<code>seen</code> is a <b>set</b>: curly brackets with only values. A set throws repeats away, so the second 2 vanishes and the set holds {1, 2, 3}. Sets have no order, but they are very fast at answering: is this value inside?'],['4','<code>ages</code> is a <b>dictionary</b>: curly brackets with <code>key: value</code> pairs. You do not look things up by position, you look them up by key. The key <code>\'Ben\'</code> leads to the value 22.'],['6','Three things are printed. <code>len(shopping)</code> counts the items, 3 (the repeat counts). <code>point[0]</code> takes the item at position 0, because Python starts counting at 0, so it gives 3. Then the whole set is printed, without the repeat.'],['7','<code>ages[\'Ben\']</code> asks the dictionary: what is stored under the key Ben? The answer is 22. If the key did not exist, Python would stop with an error.'],['8','The word <code>in</code> is a yes or no question: is this value inside? The answers are True for 3 and False for 7. Two answers on one line, so two words are printed.'],['9','<code>.add(7)</code> puts a new value into the set. The set is changed in place, and nothing is returned.'],['10','Printing again shows that the set now has four values: 1, 2, 3 and 7.']])}

<h2>2. Loops and comprehensions</h2>
${C(String.raw`
for i in range(3):            # i = 0, 1, 2
    print("step", i)

squares = [n * n for n in range(5)]        # list comprehension
evens = [n for n in range(10) if n % 2 == 0]
print(squares)
print(evens)
`,{run:true})}
<p>A comprehension is a loop that builds a list in one line. The pattern is <code>[what for item in source if condition]</code>.</p>

<h2>3. Why copying matters</h2>
<p>In the Hanoi code, <code>result()</code> must make a <em>new</em> state and leave the old one alone. If you just write <code>b = a</code>, you do not get a new list. You get a second name for the same list.</p>
${VZ('alias','Two names, one list')}
${C(String.raw`
a = [1, 2, 3]
b = a            # NOT a copy
b.append(99)
print(a)         # a changed too!

c = [1, 2, 3]
d = list(c)      # a real copy
d.append(99)
print(c)         # c is untouched
`,{run:true})}

<h2>4. Functions</h2>
${C(String.raw`
def area(width, height=1):
    """Return the area of a rectangle."""
    return width * height

print(area(3, 4))
print(area(5))        # height uses the default value 1
`,{run:true})}

<h2>5. Classes and inheritance</h2>
<p>A class is a blueprint. <code>self</code> means "this particular object". The function named <code>__init__</code> runs when you create the object. A <em>child class</em> takes everything from its parent and adds or replaces things. This is exactly what <code>class Hanoi(Problem)</code> does.</p>
${C(String.raw`
class Animal:
    def __init__(self, name):
        self.name = name

    def speak(self):
        return "..."

class Dog(Animal):                    # Dog inherits from Animal
    def __init__(self, name, age):
        super().__init__(name)        # let the parent set up name
        self.age = age

    def speak(self):                  # replaces the parent version
        return self.name + " says woof"

d = Dog("Rex", 3)
print(d.speak())
print(d.age)
`,{run:true})}
${EX([['1-3','<code>class Animal</code> starts a blueprint. <code>__init__</code> is a special function: Python runs it by itself every time you make a new Animal. <code>self</code> means \'this exact animal\'. The line <code>self.name = name</code> stores the given name inside the object, so the animal remembers it.'],['5-6','<code>speak</code> is a method, a function that belongs to the class. The basic Animal answers with three dots, because a general animal has no particular sound.'],['8','<code>class Dog(Animal)</code>: the name in brackets is the <b>parent</b>. Dog automatically gets everything Animal has, and we only write what is new or different. The search code does the same thing with <code>class Hanoi(Problem)</code>.'],['9-10','The Dog needs one more value, <code>age</code>, so it has its own <code>__init__</code>. <code>super().__init__(name)</code> means: run the parent\'s setup first. Then we do not copy the name code again.'],['11','The new part that only dogs have: the age is stored next to the name.'],['13-14','Dog has a method called <code>speak</code> too, with the same name as the parent. When a child uses the same name, its own version wins. This is called <b>overriding</b>. It is how your puzzle class replaces <code>actions</code> and <code>result</code> of the parent Problem.'],['16','<code>Dog(\'Rex\', 3)</code> builds one real dog. Python calls the Dog <code>__init__</code> with name Rex and age 3.'],['17','<code>d.speak()</code> finds speak in Dog (not in Animal) and returns \'Rex says woof\'.'],['18','<code>d.age</code> reads the value that was stored in the object. It prints 3.']])}
${NOTE('In the search lessons, <code>Problem</code> is the parent. You write a child class and override <code>actions</code> and <code>result</code>. The search functions then work on your problem without knowing what it is about.','ok')}

<h2>6. numpy in one minute</h2>
<p>numpy gives fast arrays. The only operation you need for neural networks is the <em>dot product</em>: multiply matching numbers, then add.</p>
${C(String.raw`
import numpy as np

x = np.array([1.0, 2.0, 3.0])
w = np.array([0.5, -1.0, 2.0])

print(x * w)            # element by element
print(np.dot(x, w))     # 1*0.5 + 2*(-1) + 3*2
print(x.mean(), x.max())
`,{run:true})}

L({id:'statespace',num:'02',group:'Part 1 · Search',title:'State spaces and problems',
html:()=>`
<div class="kick">Part 1 · Search · about 25 minutes</div>
<h1>How a computer thinks about "a problem"</h1>
<p class="lede">Before any clever algorithm, we need one boring but powerful idea: describe the problem in a fixed shape. If you describe it the same way every time, one search algorithm can solve every problem.</p>

<h2>The five parts of a search problem</h2>
<div class="defs">
 <div><b>Initial state</b>Where we start. For Hanoi: all disks on peg A.</div>
 <div><b>Actions(state)</b>The legal moves from a state. Different in every state.</div>
 <div><b>Result(state, action)</b>The new state after a move. Must not change the old one.</div>
 <div><b>Goal test(state)</b>"Are we done?" Answers True or False.</div>
 <div><b>Path cost</b>The price of a route. By default each step costs 1.</div>
</div>
<p>A <b>state</b> is a snapshot of everything that matters at one moment. The set of all states, joined by actions, is the <b>state space</b>. It is a graph: states are the dots, actions are the arrows. Searching means finding a path through it from the start dot to a goal dot.</p>

<h3>Try walking a state space yourself</h3>
<p>Each number on a line is the cost of that move. Reach <b>G</b> as cheaply as you can.</p>
${VZ('statewalk','State space · click to move')}
<p>Moving to the nearest-looking neighbour is not always cheapest. Finding the best route without trying everything by hand is exactly why search algorithms exist.</p>

<h2>The Problem class from your folder</h2>
<p>Your file <code>search.py</code> has a class called <code>Problem</code> that holds those five parts. You never use it directly. You write a child class for your puzzle and fill in two methods, <code>actions</code> and <code>result</code>.</p>
${C(String.raw`
class Problem:
    def __init__(self, initial, goal=None):
        self.initial = initial      # the starting state
        self.goal = goal            # one goal state, or a list of goal states

    def actions(self, state):
        raise NotImplementedError   # YOU write this in your child class

    def result(self, state, action):
        raise NotImplementedError   # YOU write this too

    def goal_test(self, state):
        if isinstance(self.goal, list):
            for s in self.goal:
                if s == state:
                    return True
            return False
        return state == self.goal

    def path_cost(self, c, state1, action, state2):
        return c + 1                # every step costs 1 unless you change it
`,{title:'search.py (shortened)'})}
${EX([['1-2','The class <code>Problem</code> is the blueprint of every puzzle. When you create a puzzle you give it a starting state, and optionally a goal.'],['3-4','The start is saved in <code>self.initial</code> and the goal in <code>self.goal</code>. The goal may be a single state or a list of states. Your own puzzle classes will usually call this with <code>super().__init__(...)</code>.'],['6-7','<code>actions</code> must answer: from this state, which moves are legal? The parent does not know your puzzle, so it only raises an error as a reminder: YOU write this method in your child class.'],['9-10','<code>result</code> must answer: if I do this action in this state, what new state do I get? It also raises an error, so you must write it yourself.'],['12','<code>goal_test</code> asks: is this state the goal? This one is already written for you.'],['13-17','If <code>self.goal</code> is a list, we loop through the goals. If the state equals any one of them we answer True. If the loop ends without a match, the answer is False. This is why the Hanoi code puts its goal inside an extra list.'],['18','If the goal is a single state, we just compare with it directly. The result of <code>==</code> is True or False.'],['20-21','<code>path_cost</code> gets the cost so far (<code>c</code>) and returns <code>c + 1</code>, so every move costs 1. If moves in your puzzle have different prices, you override this method.']])}
${NOTE('<code>raise NotImplementedError</code> is Python for "a child class must replace this". If you forget to write <code>actions</code>, you get exactly that error.','warn')}

<h2>The Node class: remembering the way back</h2>
<p>Search does not move around states. It builds <b>nodes</b>. A node wraps a state and remembers its parent, the action that created it, and the cost so far. When we find the goal, we follow the parent links backwards to read off the solution.</p>
${C(String.raw`
class Node:
    def __init__(self, state, parent=None, action=None, path_cost=0):
        self.state = state
        self.parent = parent
        self.action = action
        self.path_cost = path_cost
        self.depth = 0
        if parent:
            self.depth = parent.depth + 1

    def expand(self, problem):
        return [self.child_node(problem, action)
                for action in problem.actions(self.state)]

    def child_node(self, problem, action):
        next_state = problem.result(self.state, action)
        cost = problem.path_cost(self.path_cost, self.state, action, next_state)
        return Node(next_state, self, action, cost)

    def solution(self):
        return [node.action for node in self.path()[1:]]

    def path(self):
        node, back = self, []
        while node:
            back.append(node)
            node = node.parent
        return list(reversed(back))

<div class="kick">Part 1 · Search · about 30 minutes</div>
<h1>Towers of Hanoi</h1>
<p class="lede">Three pegs, three disks. Move the whole stack from peg A to another peg. One disk at a time. Never put a bigger disk on a smaller one.</p>
${VZ('hanoi','Play it · click a peg to pick up its top disk, click another peg to drop it')}
<p>Then press <b>Solve it for me</b>. The computer finds the shortest solution by exploring the state space with <b>breadth-first search</b>. By the end of this page you will have written that.</p>
<div class="note"><b class="l">Quick fact</b>With n disks the fewest moves is 2<sup>n</sup> − 1. Three disks: 7 moves. Ten disks: 1023.</div>

<h2>Step 1 · Choose how to store a state</h2>
<p>We need to record which disks sit on which peg. The course code uses a <b>list of three sets</b>:</p>
<table><tr><th>Position</th><th>Meaning</th><th>At the start</th></tr>
<tr><td>state[0]</td><td>disks on peg A</td><td class="mono">{1, 2, 3}</td></tr>
<tr><td>state[1]</td><td>disks on peg B</td><td class="mono">set()</td></tr>
<tr><td>state[2]</td><td>disks on peg C</td><td class="mono">set()</td></tr></table>
<p>Disk 1 is the smallest. A set is a good choice because order does not matter: the top disk of a peg is always its <em>smallest</em> number, so <code>min(peg)</code> gives it.</p>

<h2>Step 2 · The class, and a run</h2>
${C(String.raw`
import math
from search import Problem, breadth_first_tree_search
import search

class Hanoi(Problem):
    def __init__(self, target_peg):
        initial = [{1, 2, 3}, set(), set()]
        goal_state = [set(), set(), set()]
        goal_state[target_peg] = {1, 2, 3}
        super().__init__(initial, [goal_state])

    def actions(self, state):
        acts = []
        inf_set = {math.inf}
        for i in range(3):
            for j in range(3):
                if i == j or not state[i]:
                    continue
                top_i = min(state[i])
                top_j = min(state[j].union(inf_set))
                if top_i < top_j:
                    acts.append("o {} {} {}".format(i + 1, j + 1, top_i))
        return acts

    def result(self, state, action):
        _, i, j, k = action.split(' ')
        i, j, k = int(i) - 1, int(j) - 1, int(k)
        new_state = [set(peg) for peg in state]
        new_state[i].discard(k)
        new_state[j].add(k)
        return new_state

h = Hanoi(target_peg=2)
print("Legal first moves:", h.actions(h.initial))

node = breadth_first_tree_search(h)
moves = node.solution()
print("Solved in", len(moves), "moves")
for m in moves:
    _, i, j, k = m.split(' ')
    print("  disk", k, "from peg", i, "to peg", j)
print("Nodes expanded by the search:", search.STATS["expanded"])

<div class="kick">Part 1 · Search · about 25 minutes</div>
<h1>Pouring water between three cups</h1>
<p class="lede">Cup 1 holds 5 units, cup 2 holds 3, cup 3 holds 2. Cup 1 starts full, the others are empty. You pour water from one cup into another until the poured-from cup is empty or the receiving cup is full. Goal: cup 1 has 4, and the last unit sits in cup 2 or cup 3.</p>
${VZ('cups','Pour it yourself · the graph below is the whole state space')}
<p>Each box in the graph is one <b>state</b>, written as (cup1, cup2, cup3). Every line is a legal pour. The puzzle has only a handful of reachable states, so a computer can look at all of them. That is the typical shape of a search problem: a small, fully known graph.</p>

<h2>The state and the goals</h2>
<p>A state is a <b>tuple</b> of three numbers: <code>(5, 0, 0)</code>. We use a tuple (not a list) so that the search can put states in a "visited" set. There are <em>two</em> goal states, <code>(4, 0, 1)</code> and <code>(4, 1, 0)</code>, so the goal is a list of both.</p>

<h2>The class</h2>
<p>Your file <code>cup3_base.py</code> has two versions of the actions. The first one lists each pour by hand. The second uses two loops. The loops are shorter, and they hide fewer bugs, so we use that one in the program below.</p>
<h2>Random wandering versus a real search</h2>
<p>Your <code>search.py</code> has a function <code>Trial_Error</code>. It chooses a random legal action again and again until it happens to land on a goal. Compare it with breadth-first graph search. Run it several times and watch the random one change.</p>
${C(String.raw`
import search
from search import Problem, breadth_first_graph_search, breadth_first_tree_search, Trial_Error

CAPACITY = (5, 3, 2)

class Cup3(Problem):
    def __init__(self):
        super().__init__((5, 0, 0), [(4, 0, 1), (4, 1, 0)])

    def actions(self, state):
        acts = []
        for i in range(1, 4):
            for j in range(1, 4):
                if i != j:
                    if state[i - 1] > 0 and state[j - 1] < CAPACITY[j - 1]:
                        acts.append("o {} {}".format(i, j))
        return acts

    def result(self, state, action):
        parts = action.split()
        i = int(parts[1]) - 1
        j = int(parts[2]) - 1
        state = list(state)
        m = min(state[i], CAPACITY[j] - state[j])
        state[i] -= m
        state[j] += m
        return tuple(state)

c = Cup3()

node = breadth_first_graph_search(c)
print("BFS graph  :", node.solution(), "| nodes expanded:", search.STATS["expanded"])
print("path:", [n.state for n in node.path()])

node = breadth_first_tree_search(c)
print("BFS tree   :", len(node.solution()), "moves | nodes expanded:", search.STATS["expanded"])

lucky = Trial_Error(c)
print("random walk:", len(lucky.solution()), "moves (changes every run)")

html:()=>`
<div class="kick">Part 1 · Search · about 30 minutes</div>
<h1>Four queens on a 4×4 board</h1>
<p class="lede">Place four queens so none attacks another. A queen attacks along its row, its column and both diagonals.</p>
${VZ('queens','Place queens by clicking · × means attacked')}
<p>This looks different from Hanoi. There is no "start position and moves". Instead we <em>build</em> the answer one queen at a time. Search still works, because "put a queen here" is just an action that changes the state.</p>

<h2>How the course code stores the board</h2>
<p>A state is a 4×4 grid of numbers (a tuple of tuples):</p>
<table><tr><th>Number</th><th>Meaning</th></tr><tr><td class="mono">0</td><td>empty and still free</td></tr><tr><td class="mono">1</td><td>a queen is here</td></tr><tr><td class="mono">2</td><td>this cell is attacked by a queen, so it is not allowed</td></tr></table>
<p>The clever part: <code>result()</code> marks every attacked cell with a 2. After that, <code>actions()</code> only has to list the cells that are still 0. The rule "no two queens attack each other" is built into the state itself, so you never have to check it separately.</p>
${NOTE('Because attacked cells become 2, a queen can never be placed in a way that attacks another. That is why the goal test only counts rows. A dead end is possible, though: a board where every free cell is gone and a row is still empty. Try to make one in the board above.','')}

<h2>Run the search</h2>
<p>Here is the whole program with a search at the bottom. Run it. Both searches are <b>tree</b> searches. BFS goes level by level. DFS dives down one branch first.</p>
${C(String.raw`
from search import Problem, breadth_first_tree_search, depth_first_tree_search
import search

def convert_state_to_list(state_tuple):
    return [list(x) for x in state_tuple]

def convert_state_to_tuple(state_list):
    return tuple([tuple(x) for x in state_list])

class FourQueensProblem(Problem):
    def __init__(self):
        empty_row = (0, 0, 0, 0)
        super().__init__((empty_row, empty_row, empty_row, empty_row))

    def actions(self, state):
        acts = []
        for i in range(4):
            for j in range(4):
                if state[i][j] == 0:
                    acts.append("o {} {}".format(i + 1, j + 1))
        return acts

    def result(self, state, action):
        i = int(action.split(' ')[1]) - 1
        j = int(action.split(' ')[2]) - 1
        new_state = convert_state_to_list(state)
        for l in range(4):
            for k in range(4):
                if l == i and k == j:
                    new_state[l][k] = 1
                elif l == i or k == j or abs(i - l) == abs(j - k):
                    new_state[l][k] = 2
        return convert_state_to_tuple(new_state)

    def goal_test(self, state):
        for i in range(4):
            if 1 not in state[i]:
                return False
        return True

q = FourQueensProblem()
print("actions at the start:", len(q.actions(q.initial)))

bfs = breadth_first_tree_search(q)
print("BFS found:", bfs.solution(), "| expanded:", search.STATS["expanded"])
dfs = depth_first_tree_search(q)
print("DFS found:", dfs.solution(), "| expanded:", search.STATS["expanded"])

print("final board (1 = queen):")
for row in dfs.state:
    print(row)
`,{run:true,title:'4 queens with BFS and DFS'})}

ned.'],['46-47','Depth-first search follows one branch as deep as it can first. Here it usually opens many fewer nodes.'],['49-51','Print the final board row by row. A 1 is a queen, a 2 is a cell that is attacked, a 0 would be a free cell.']])}
<p>Both find a valid board, but DFS usually looks at far fewer nodes. Every solution here is exactly 4 moves deep, so diving straight down reaches one quickly. BFS must finish all shallower levels first.</p>
<div class="note ok"><b class="l">Remember</b>The 4-queens puzzle has exactly <b>2</b> solutions: queens at (row, column) = (1,2) (2,4) (3,1) (4,3), and its mirror image (1,3) (2,1) (3,4) (4,2).</div>

<h2>Another way to see it: backtracking</h2>
<p>The auto-solve button above does not click random cells. It fills one row at a time, and when a row has no safe column it <em>backs up</em> and changes the previous choice. That is depth-first search with an extra rule: "never try an attacked cell". It tries far fewer boards than the version that considers all 16 cells at every step.</p>

html:()=>`
<div class="kick">Part 1 · Search · about 30 minutes</div>
<h1>Breadth-first and depth-first search</h1>
<p class="lede">You now know how to describe a problem. These two algorithms find the answer. They differ in one tiny detail: which waiting node they pick next.</p>

<h2>The frontier</h2>
<p>Every search keeps a list of nodes that are <b>waiting to be expanded</b>. This list is the <b>frontier</b>. The loop is always the same:</p>
<ol><li>Take a node out of the frontier.</li><li>If it is a goal, stop and return it.</li><li>Otherwise expand it (make its children) and put the children into the frontier.</li><li>Repeat.</li></ol>
<p>The only difference between algorithms is <em>which</em> node step 1 takes.</p>
<div class="defs">
 <div><b>BFS · queue</b>First in, first out. Takes the oldest waiting node. The search spreads out level by level, like ripples on water.</div>
 <div><b>DFS · stack</b>Last in, first out. Takes the newest waiting node. The search dives down one branch as far as it can before coming back.</div>
</div>
${VZ('bfsdfs','Watch the frontier · try both, then move the goal')}
<p>Put the goal at <b>K</b>: DFS reaches it sooner. Move it to <b>C</b> (top right): BFS wins. Neither is "faster" in general. It depends on where the answer is.</p>
${NOTE('In the Python code, DFS adds the children in order and pops the <em>last</em> one. So it explores the right-most child first. That is why the visualizer also goes right first.','')}

<h2>The code from your search.py</h2>
${C(String.raw`
from collections import deque

def breadth_first_tree_search(problem):
    frontier = deque([Node(problem.initial)])   # FIFO queue
    while frontier:
        node = frontier.popleft()               # take the OLDEST
        if problem.goal_test(node.state):
            return node
        frontier.extend(node.expand(problem))
    return None

def depth_first_tree_search(problem):
    frontier = [Node(problem.initial)]          # stack (plain list)
    while frontier:
        node = frontier.pop()                   # take the NEWEST
        if problem.goal_test(node.state):
            return node
        frontier.extend(node.expand(problem))
    return None
`,{title:'search.py'})}
${EX([['1','<code>deque</code> (say: deck) is a list that is fast at removing items from the front. An ordinary list is slow at that.'],['3','BFS gets the problem. We explain the loop below, and it is the same for tree search and for graph search.'],['4','The <b>frontier</b> is the list of nodes that are waiting to be opened. It starts with one node: the start state.'],['5','Repeat while the frontier has something in it. If it becomes empty, every possibility was tried.'],['6','<code>popleft()</code> takes out the first item, the one waiting the longest. First in, first out: this is a <b>queue</b>. That is the whole idea of breadth-first search: oldest first, so level by level.'],['7-8','Is this node the goal? Then return it. The caller can ask the node for <code>solution()</code> to get the moves.'],['9','Not the goal: open the node. <code>expand</code> makes all its children, and <code>extend</code> adds them to the back of the frontier.'],['10','The loop ended and nothing was found, so there is no solution. We return <code>None</code>.'],['12-13','DFS looks the same, but the frontier is an ordinary Python list, used as a <b>stack</b>.'],['15','<code>pop()</code> removes the LAST item: the child that was added most recently. Last in, first out. So the search keeps going deeper along one branch before it comes back.'],['16-19','All the rest is identical. Only the line that removes from the frontier changed (<code>popleft</code> versus <code>pop</code>), and that one change turns BFS into DFS.']])}

<h2>Tree search versus graph search</h2>
<p>These two are <b>tree searches</b>. They never remember what they have seen. If the state space has loops (A leads to B, B leads back to A), a tree search can walk around the loop forever, or expand the same state many times.</p>
<p><b>Graph search</b> keeps an <code>explored</code> set and skips states already in it:</p>
${C(String.raw`
def breadth_first_graph_search(problem):
    node = Node(problem.initial)
    if problem.goal_test(node.state):
        return node
    frontier = deque([node])
    explored = set()
    while frontier:
        node = frontier.popleft()
        explored.add(node.state)
        for child in node.expand(problem):
            if child.state not in explored and child not in frontier:
                if problem.goal_test(child.state):
                    return child
                frontier.append(child)
    return None
`,{title:'search.py'})}
${EX([['1','The graph version of BFS, shown in full. The difference to the tree version is the <code>explored</code> set.'],['2-4','Create the start node. If the start already is the goal, return it at once.'],['5','The frontier is a queue holding the start node.'],['6','<code>explored</code> is a set of states we have already opened. States must be hashable for this, which is why we used tuples earlier.'],['7-8','Repeat while there are waiting nodes, and take the oldest one.'],['9','Mark its state as explored: we will never open it again.'],['10','Open the node and look at each child.'],['11','Keep a child only if its state was never explored and it is not waiting in the frontier already. This is how graph search avoids repeating work.'],['12-13','Graph BFS checks for the goal when a child is created, not when it is taken out. That saves one level of work and still gives the shortest path when all costs are equal.'],['14','Otherwise the child joins the back of the queue.'],['15','No goal found: return None.']])}

<h2>See it in code</h2>
<p>Run this. It uses a small map. The <code>Spy</code> class records the order in which nodes are tested.</p>
${C(String.raw`
from search import Problem, breadth_first_tree_search, depth_first_tree_search

GRAPH = {"A": ["B", "C"], "B": ["D", "E"], "C": ["F"],
         "D": [], "E": ["G"], "F": ["G"], "G": []}

class Spy(Problem):
    def __init__(self, initial, goal):
        super().__init__(initial, goal)
        self.seen = []

    def actions(self, state):
        return GRAPH[state]

    def result(self, state, action):
        return action

    def goal_test(self, state):
        self.seen.append(state)
        return state == self.goal

for name, algo in [("BFS", breadth_first_tree_search),
                   ("DFS", depth_first_tree_search)]:
    p = Spy("A", "G")
    node = algo(p)
    print(name, "checked:", p.seen)
    print("    path:", [n.state for n in node.path()])
`,{run:true,title:'bfs vs dfs on a small map'})}
${EX([['1','Imports your Problem class and the two search functions.'],['3-4','The map as a dictionary. Each place has a list of the places you can walk to. For example B leads to D and E. D leads nowhere, its list is empty.'],['6-9','<code>Spy</code> is a puzzle that also keeps a list, <code>self.seen</code>, of every state the search asks about. It is a way to watch the algorithm think.'],['11-12','The legal actions in a state are the neighbours on the map.'],['14-15','The action is itself the next place, so <code>result</code> just returns the action.'],['17-19','<code>goal_test</code> is called once for every node taken out of the frontier. We record the state each time, then compare with the goal. So <code>seen</code> becomes the visiting order.'],['21-22','A list of two (name, function) pairs. Functions can be stored in a list and called later, so one loop runs both algorithms.'],['23-24','Make a fresh puzzle each time and run the algorithm.'],['25','Print the order in which the states were checked. BFS goes by level (A, B, C, D, ...), DFS goes deep first.'],['26','Print the path from A to G: the state of each node on the path.']])}

<h3>When tree search never stops</h3>
<p>Here A and B can reach each other, and the goal is unreachable. Tree DFS walks A, B, A, B... forever. Our version of the library stops it with an error after 30000 expansions, so your browser stays alive.</p>
${C(String.raw`
from search import Problem, depth_first_tree_search, depth_first_graph_search

LOOP = {"A": ["B"], "B": ["A"]}

class Loopy(Problem):
    def actions(self, state):
        return LOOP[state]
    def result(self, state, action):
        return action

print("graph search:", depth_first_graph_search(Loopy("A", "Z")))
try:
    depth_first_tree_search(Loopy("A", "Z"))
except RuntimeError as e:
    print("tree search:", e)

<p>Graph search sees that A and B were already explored and returns <code>None</code> ("no solution") at once. Tree search never finishes.</p>

<h2>Comparing them</h2>
<p>Let <b>b</b> be the branching factor (children per node), <b>d</b> the depth of the shallowest goal, and <b>m</b> the deepest the tree goes.</p>
<table><tr><th></th><th>BFS</th><th>DFS</th></tr>
<tr><td>Finds a solution if one exists?</td><td>Yes</td><td>Only if there are no endless branches (use graph search)</td></tr>

<tr><td>Best used when</td><td>You need the shortest path</td><td>Memory is tight, any answer will do</td></tr></table>

def bfs_path(graph, start, goal):

<div class="kick">Part 1 · Search · about 35 minutes</div>
<h1>Searching with a good guess</h1>
<p class="lede">BFS and DFS are <em>blind</em>: they know nothing about where the goal is. If you can estimate "how far is the goal from here?", you can search much more cleverly.</p>

<h2>Heuristic: a cheap estimate</h2>
<p>A <b>heuristic</b> <code>h(n)</code> guesses the cost from node <code>n</code> to the nearest goal. For walking on a grid, the Manhattan distance (rows apart + columns apart) is a good one. It ignores walls, so it is only a guess, but it is free to compute.</p>
<p>Together with <code>g(n)</code>, the real cost paid so far, we get three famous strategies. All three are the same loop: take the waiting node with the lowest <b>f</b>.</p>
<table><tr><th>Strategy</th><th>f(n)</th><th>Behaviour</th></tr>
<tr><td>Uniform cost (BFS with costs)</td><td class="mono">g</td><td>Cheapest path first. Optimal. Explores in all directions.</td></tr>
<tr><td>Greedy best-first</td><td class="mono">h</td><td>Rushes toward the goal. Fast, but can be fooled and is not optimal.</td></tr>
<tr><td>A*</td><td class="mono">g + h</td><td>Balances the cost so far and the estimate to go. Optimal if h never overestimates.</td></tr></table>
${NOTE('A heuristic is <b>admissible</b> if it never overestimates the true remaining cost. Manhattan distance on a grid is admissible, because walls can only make the real path longer. With an admissible h, A* returns the cheapest path.','ok')}

${VZ('astar','Race three algorithms · click cells to build walls')}
<p>Try: run <b>BFS</b>, then <b>A*</b>. BFS fills a huge disc; A* explores a thin strip toward the goal. Then press <b>Wall with a gap</b> and run <b>Greedy</b>: it hugs the wall and gives a longer path. A* still finds the shortest.</p>

<h2>A* in code</h2>
<p>In your <code>search.py</code>, A* is just best-first search with a particular f. Everything else is the same code.</p>
${C(String.raw`
def best_first_graph_search(problem, f):
    node = Node(problem.initial)
    frontier = PriorityQueue('min', f)   # always gives back the lowest f
    frontier.append(node)
    explored = set()
    while frontier:
        node = frontier.pop()            # the waiting node with the lowest f
        if problem.goal_test(node.state):
            return node
        explored.add(node.state)
        for child in node.expand(problem):
            if child.state not in explored and child not in frontier:
                frontier.append(child)
            elif child in frontier:
                if f(child) < frontier[child]:     # found a cheaper way
                    del frontier[child]
                    frontier.append(child)
    return None

def uniform_cost_search(problem):
    return best_first_graph_search(problem, lambda node: node.path_cost)

def astar_search(problem, h=None):
    h = h or problem.h
    return best_first_graph_search(problem, lambda n: n.path_cost + h(n))
`,{title:'search.py (shortened)'})}

<h2>Run it on a maze</h2>
<p>Here a grid becomes a <code>Problem</code>. States are <code>(row, column)</code>. We compare uniform cost with A* by counting how many nodes each expanded.</p>
${C(String.raw`
import search
from search import Problem, uniform_cost_search, astar_search

GRID = ["S.......",
        ".....#..",
        "..####..",
        ".....#..",
        ".....#.G",
        "........"]
MOVES = {"up": (-1, 0), "down": (1, 0), "left": (0, -1), "right": (0, 1)}

class Maze(Problem):
    def __init__(self):
        self.walls = set()
        for r, row in enumerate(GRID):
            for c, ch in enumerate(row):
                if ch == "#":
                    self.walls.add((r, c))
                elif ch == "S":
                    start = (r, c)
                elif ch == "G":
                    goal = (r, c)
        super().__init__(start, goal)

    def actions(self, state):
        acts = []
        for name, (dr, dc) in MOVES.items():
            r, c = state[0] + dr, state[1] + dc
            if 0 <= r < len(GRID) and 0 <= c < len(GRID[0]) and (r, c) not in self.walls:
                acts.append(name)
        return acts

    def result(self, state, action):
        dr, dc = MOVES[action]
        return (state[0] + dr, state[1] + dc)

    def h(self, node):
        return abs(node.state[0] - self.goal[0]) + abs(node.state[1] - self.goal[1])

m = Maze()
a = uniform_cost_search(m)
print("uniform cost: path", a.path_cost, "| expanded", search.STATS["expanded"])
b = astar_search(m)
print("A*          : path", b.path_cost, "| expanded", search.STATS["expanded"])
print(b.solution())
`,{run:true,title:'maze: uniform cost vs A*'})}

<h2>A different idea: hill climbing</h2>
<p>A* remembers a whole frontier. <b>Hill climbing</b> remembers only where it is now. At every step it looks at the neighbours and moves to the best one. If no neighbour is better, it stops. It uses almost no memory and is fast, but it can get stuck on a <b>local maximum</b>: a hilltop that is not the highest hill.</p>
<p>Here the heights of 12 positions are given. Positions 3 and 8 are peaks, but only 8 is the tallest.</p>
${C(String.raw`
from search import Problem, hill_climbing

VALUES = [1, 3, 4, 6, 5, 2, 3, 7, 9, 8, 4, 1]   # height at each position

class Hills(Problem):
    def actions(self, state):
        acts = []
        if state > 0:
            acts.append("left")
        if state < len(VALUES) - 1:
            acts.append("right")
        return acts

    def result(self, state, action):
        return state - 1 if action == "left" else state + 1

    def value(self, state):
        return VALUES[state]

for start in range(len(VALUES)):
    end = hill_climbing(Hills(start))
    print("start", start, "-> stops at", end, "height", VALUES[end])

html:()=>`
<div class="kick">Part 2 · Probability · about 30 minutes</div>
<h1>Updating a belief with evidence</h1>
<p class="lede">Search assumed a perfect world: you know the state and the moves. Real data is uncertain. Probability is the tool for reasoning when you are not sure.</p>

<h2>The words you need</h2>
<div class="defs">
 <div><b>P(A)</b>The probability that A happens: a number from 0 (never) to 1 (always).</div>
 <div><b>P(A | B)</b>"A given B". The probability of A once you already know B happened.</div>
 <div><b>Independent</b>Knowing B tells you nothing about A. Then P(A and B) = P(A) × P(B).</div>
 <div><b>Complement</b>P(not A) = 1 − P(A).</div>
</div>
<p>Conditional probability is a fraction of a smaller world: <b>P(A | B) = P(A and B) / P(B)</b>. Among the cases where B happened, which fraction also have A?</p>

<h2>Bayes' theorem</h2>
<p>Write the conditional formula both ways round and combine them:</p>
<div class="note" style="font-size:20px;font-family:var(--serif);text-align:center"><b>P(A | B) = P(B | A) × P(A) / P(B)</b></div>
<table><tr><th>Name</th><th>Symbol</th><th>Plain meaning</th></tr>
<tr><td>Posterior</td><td class="mono">P(A | B)</td><td>What we want: belief in A after seeing B</td></tr>
<tr><td>Likelihood</td><td class="mono">P(B | A)</td><td>How likely we would see B if A were true</td></tr>
<tr><td>Prior</td><td class="mono">P(A)</td><td>Belief in A before seeing anything</td></tr>
<tr><td>Evidence</td><td class="mono">P(B)</td><td>How common B is overall</td></tr></table>
<p>In text classification, A is a class (positive or negative review) and B is the words in the text. We choose the class with the larger posterior.</p>

<h2>The classic surprise</h2>
<p>A disease affects 1% of people. A test catches 90% of sick people but also wrongly flags 9% of healthy people. You test positive. How likely are you sick? Most people say "about 90%". Move the sliders and see.</p>
${VZ('bayes','1000 people · counting instead of formulas')}
<p>With the starting numbers, only about <b>9%</b> of positives are really sick. The disease is so rare that false alarms from the huge healthy group outnumber the real cases. This is <b>base-rate neglect</b>: forgetting the prior. Drag "how common" up to 20% and watch the answer climb.</p>

<h2>The same thing in code</h2>
${C(String.raw`
def bayes(prior, likelihood, false_alarm):
    # P(positive) = P(pos|sick)*P(sick) + P(pos|healthy)*P(healthy)
    evidence = likelihood * prior + false_alarm * (1 - prior)
    return likelihood * prior / evidence

print("1% sick   :", bayes(0.01, 0.90, 0.09))
for prior in [0.001, 0.01, 0.1, 0.5]:
    p = bayes(prior, 0.90, 0.09)
    print("prior", prior, "-> posterior", round(p, 3))
`,{run:true,title:'bayes in 6 lines'})}
${EX([['1','The function takes three numbers: the <b>prior</b> (how common the disease is), the <b>likelihood</b> (how often the test says positive for a sick person) and the <b>false alarm</b> rate (how often it says positive for a healthy person).'],['2','A comment that reminds us of the formula for the evidence.'],['3','The <b>evidence</b> is the chance of a positive test at all. Positive tests come from two groups: sick people who test positive (likelihood times prior) and healthy people who test positive (false alarm times the share of healthy people, <code>1 - prior</code>). We add both.'],['4','Bayes\' theorem: likelihood times prior, divided by evidence. The answer is the <b>posterior</b>: the chance of being really sick after a positive test.'],['6','With a 1% prior, a test that finds 90% of the sick and wrongly flags 9% of the healthy, the answer is about 0.092. Only 9.2% of the positives are really sick!'],['7-9','Try other priors: 0.1%, 1%, 10% and 50%. The posterior changes a lot. When a disease is very rare, most positive results are false alarms, even when the test is quite good.']])}

<h3>Check it by simulating</h3>
<p>If you do not trust the formula, test it on pretend people. This is a good habit: a quick simulation is an independent check.</p>
${C(String.raw`
import random
random.seed(1)

positives = 0
sick_and_positive = 0
for _ in range(200000):
    sick = random.random() < 0.01             # 1% are sick
    if sick:
        positive = random.random() < 0.90     # test catches 90%
    else:
        positive = random.random() < 0.09     # false alarm 9%
    if positive:
        positives += 1
        if sick:
            sick_and_positive += 1

print("positives:", positives)
print("share of positives who are sick:", round(sick_and_positive / positives, 3))
`,{run:true,title:'simulation'})}
<p>The simulated share lands close to 0.092, matching the formula.</p>

<h2>Why this matters next lesson</h2>
<p>Naive Bayes does exactly this, with one extra step. A review has many words, and we need P(words | class). Counting every combination of words is impossible, so we <b>assume</b> the words are independent given the class and just multiply single-word probabilities. That assumption is rarely true (the words "not" and "good" are linked), which is why the method is called <em>naive</em>. Surprisingly, it still works well.</p>
