        rewards = train_agent(agent, epsilon)

        avg_reward = np.mean(rewards)

<li>If ε = 1, the agent always explores. It tries random actions, so it can discover rewards, but it does not fully use what it has learned.</li>

from search import Problem


class Battery(Problem):

    def __init__(self):
        # a0 = <8, 12, 20>
        super().__init__((8, 12, 20))

    def actions(self, state):
        # o(i,j) is applicable when r_i > 0 and r_j > 0, i != j
        acts = []
        for i in range(3):
            for j in range(3):
                if i != j and state[i] > 0 and state[j] > 0:
                    acts.append((i + 1, j + 1))
        return acts

    def result(self, state, action):
        i, j = action
        i -= 1
        j -= 1
        new_state = list(state)
        for k in range(3):
            if k == i or k == j:
                new_state[k] = state[k] - 1
            else:
                new_state[k] = state[k] + 2
        return tuple(new_state)

    def goal_test(self, state):
        # only one type of robot still has active batteries
        return (state[0] + state[1] == 0 or
                state[0] + state[2] == 0 or
                state[1] + state[2] == 0)

${PQ('Task 2 · 2 points','Search',`

<li>print the solution path: the states and the operators that generated them, from the initial state to the goal state.</li>
</ul>`,
C(`
from collections import deque
from search import Problem


class Cups(Problem):
    # the Cups problem from the AI lab collection (N = 6, M = 2)

    def __init__(self):
        super().__init__((0, 0, 0, 0, 0, 0))

    def actions(self, state):
        acts = []
        for i in range(len(state)):
            for j in range(len(state)):
                if i != j and state[i] == 0 and state[j] == 0:
                    acts.append((i + 1, j + 1))
        return acts

    def result(self, state, action):
        i, j = action
        new_state = list(state)
        new_state[i - 1] = 1
        new_state[j - 1] = 1
        return tuple(new_state)

    def goal_test(self, state):
        return state == (1, 1, 1, 1, 1, 1)


class Node:

    def __init__(self, state, parent=None, action=None, path_cost=0):
        self.state = state
        self.parent = parent
        self.action = action
        self.path_cost = path_cost

    def expand(self, problem):
        children = []
        for action in problem.actions(self.state):
            next_state = problem.result(self.state, action)
            children.append(Node(next_state, self, action, self.path_cost + 1))
        return children

    def path(self):
        node = self
        nodes = []
        while node is not None:
            nodes.append(node)
            node = node.parent
        nodes.reverse()
        return nodes

    def __repr__(self):
        return "Node(" + str(self.state) + ")"


def breadth_first_tree_search(problem):
    frontier = deque([Node(problem.initial)])
    while frontier:
        node = frontier.popleft()
        if problem.goal_test(node.state):
            return node
        frontier.extend(node.expand(problem))
    return None


def main():
    problem = Cups()
    goal = breadth_first_tree_search(problem)
    if goal is None:
        print("No solution found.")
        return
    for node in goal.path():
        print("State:", node.state, "Operator:", node.action)


if __name__ == "__main__":
    main()
`,{title:'Node and breadth-first tree search'})+`<p>The files do not define "Cup3", so this uses the Cups problem from the AI lab collection. The search code does not depend on the problem. For <b>depth-first</b> tree search, as the first line of the task says, replace <code>deque</code> with a plain list and <code>popleft()</code> with <code>pop()</code>.</p>`,

import numpy as np
import matplotlib.pyplot as plt
from sklearn.model_selection import train_test_split
from sklearn.preprocessing import StandardScaler
from sklearn.metrics import classification_report
from tensorflow import keras

# Load the file: header row first, the last column is the quality label
data = np.loadtxt("wine_quality_class.csv", delimiter=",", skiprows=1)

y = data[:, -1].astype(int)

# Quality values (for example 3..8) become class numbers 0..k-1
classes, y = np.unique(y, return_inverse=True)
num_classes = len(classes)

# 85% training, 15% test
x_train, x_test, y_train, y_test = train_test_split(
    x, y, test_size=0.15, random_state=42)

# Scale the features (fit on the training part only)
scaler = StandardScaler()
x_train = scaler.fit_transform(x_train)
x_test = scaler.transform(x_test)

# Fully connected network
model = keras.Sequential([
    keras.Input(shape=(x_train.shape[1],)),
    layers.Dense(64, activation='relu'),
    layers.Dense(32, activation='relu'),
    layers.Dense(num_classes, activation='softmax'),
])

model.compile(loss='sparse_categorical_crossentropy',
              optimizer='adam', metrics=['accuracy'])

# validation_split = 0.15 keeps part of the training data as validation set

                    validation_split=0.15)

${PQ('Task 4 · 2 points','Reinforcement learning',`
<p>The <code>task4.py</code> file contains the skeleton of a <code>QLearningAgent</code> class that models a simple reinforcement learning environment. Complete the implementation by adding the following methods:</p>

<li><code>learn(self, state, action, reward, new_state, gamma)</code> – update the Q-table based on the learning rule.</li>

C(`
import numpy as np
import random


class QLearningAgent:

    def __init__(self, n_states, n_actions, learning_rate):
        self.n_states = n_states
        self.n_actions = n_actions
        self.learning_rate = learning_rate
        self.q_table = np.zeros((n_states, n_actions))

    def act(self, state, epsilon):
        # epsilon-greedy: explore with probability epsilon, otherwise exploit
        if random.uniform(0, 1) < epsilon:
            return random.randint(0, self.n_actions - 1)
        return int(np.argmax(self.q_table[state]))

    def learn(self, state, action, reward, new_state, gamma):
        # Q(s,a) = Q(s,a) + lr * (reward + gamma * max Q(s',a') - Q(s,a))
        old_value = self.q_table[state][action]
        best_next = np.max(self.q_table[new_state])
        target = reward + gamma * best_next
        self.q_table[state][action] = old_value + self.learning_rate * (target - old_value)
`,{title:'QLearningAgent: act and learn'})+`<p>Same idea as the Q-learning solution in the AI lab collection, with the epsilon test written the other way round: random action with probability epsilon, best known action otherwise.</p>`,

${PQ('Task 5 · 2 points','Theoretical question',`
<p>Explain how neural networks work. Be sure to discuss their use in classification tasks as well. Save your answer in a file named <code>task5.py</code>. Full points require a detailed explanation supported by examples.</p>`,
C(`
"""
task5.py - How neural networks work

1. The idea
A neural network is a model made of layers of artificial neurons. Every
connection between two neurons has a weight that can be adjusted. The
network learns the weights from data instead of following a rule written
by a programmer. A network has an input layer (one neuron per feature),
one or more hidden layers, and an output layer.

2. One neuron
A neuron receives inputs, multiplies each by its weight, adds the results,
adds a bias, and applies an activation function:

    z = w1*x1 + w2*x2 + ... + wn*xn + b
    a = f(z)

Example: x = (2, 3), w = (0.5, -0.2), b = 0.1
    z = 0.5*2 + (-0.2)*3 + 0.1 = 1.0 - 0.6 + 0.1 = 0.5
    ReLU(0.5) = 0.5, so the neuron outputs 0.5.

3. Activation functions
They make the network non-linear, so it can learn more than a straight line.
    ReLU:    max(0, z), the usual choice for hidden layers
    Sigmoid: output between 0 and 1, used for binary classification
    Tanh:    output between -1 and 1
    Softmax: turns the last layer into probabilities that sum to 1,
             used for multi-class classification

4. Feedforward
The input goes forward through the hidden layers to the output layer, and
the output is the prediction.

5. Loss
The loss measures how wrong the prediction is: mean squared error for
regression, binary cross-entropy for two classes, categorical
cross-entropy for many classes. A lower loss means a better prediction.

6. Training
Training repeats this cycle many times:
    forward pass -> loss -> backpropagation -> optimizer updates the weights
Backpropagation uses the chain rule to compute how much each weight
contributed to the error (the gradient). The optimizer (for example SGD or
Adam) then changes each weight against its gradient:
    w_new = w_old - learning_rate * dL/dw
One epoch is one pass over the whole training set. The data is split into
batches, and the weights are updated after every batch. A very small
learning rate makes training slow, a very large one makes it unstable.

7. Classification
In classification the network predicts a category.
Example: recognising handwritten digits (MNIST). The input is 784 pixel
values, the output layer has 10 neurons with softmax, one for each digit.
If the output is P(3) = 0.90 and all others are small, the network predicts 3.
For two classes (spam or not spam) one output neuron with sigmoid is enough.
The loss is categorical cross-entropy (or binary cross-entropy for two
classes), and accuracy is used to see how many predictions are correct.
For images, a convolutional network (Conv2D, MaxPooling2D, Flatten, Dense)
is used, because the filters look for local patterns such as edges.

8. Overfitting
A network can memorise the training data. We compare training and
validation accuracy, and use methods such as Dropout, which switches off a
random part of the neurons during training.
"""

print(__doc__)
